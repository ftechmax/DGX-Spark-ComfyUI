services:
  # ONNX Runtime GPU wheel, compiled from source for sm_121 (~45-60 min).
  # Not in the default profile: it is built on demand, and the wheel image it
  # produces is then consumed by the comfyui build below.
  #
  #   docker compose build onnxruntime
  #
  # Rebuild only when ONNXRUNTIME_REF or the CUDA base changes. The image holds
  # nothing but the wheel and is never started.
  onnxruntime:
    profiles: [ "onnxruntime" ]
    build:
      context: .
      dockerfile: Dockerfile.onnxruntime
      args:
        ONNXRUNTIME_REF: "${ONNXRUNTIME_REF:-v1.28.0}"
        # Lower this if nvcc runs out of memory during the build
        ONNXRUNTIME_JOBS: "${ONNXRUNTIME_JOBS:-8}"

    image: "${ONNXRUNTIME_IMAGE:-onnxruntime-gb10:1.28.0-cu131-sm121}"

  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Pinned refs, not branches — see .env.example on bumping them.
        COMFYUI_REF: "${COMFYUI_REF:-v0.31.0}"
        SAGEATTN_REF: "${SAGEATTN_REF:-d1a57a546c3d395b1ffcbeecc66d81db76f3b4b5}"
        # Wheel image built by the onnxruntime service above — must already exist
        ONNXRUNTIME_IMAGE: "${ONNXRUNTIME_IMAGE:-onnxruntime-gb10:1.28.0-cu131-sm121}"
        # Baked into the image so files it writes are owned by you, not root.
        # Changing these requires a rebuild, not just a restart.
        PUID: "${PUID:-1000}"
        PGID: "${PGID:-1000}"

    image: comfyui:cu130
    container_name: comfyui

    # Must match the PUID/PGID the image was built with.
    user: "${PUID:-1000}:${PGID:-1000}"

    # GPU enablement
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # LAN exposure
    ports:
      - "${COMFYUI_PORT:-8188}:8188"

    # Large tensor transfers need more than docker's 64MB default.
    shm_size: "16gb"

    environment:
      COMFYUI_PORT: "${COMFYUI_PORT:-8188}"
      # Grace-Blackwell flags. See .env.example for why each one is here — and
      # for the list of flags that were removed and must not come back.
      COMFYUI_FLAGS: "${COMFYUI_FLAGS:---listen 0.0.0.0 --port 8188 --preview-method auto --disable-pinned-memory --use-sage-attention --bf16-unet --bf16-vae --bf16-text-enc}"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"

      # torch.compile/inductor is NOT hard-disabled here any more. Triton failed
      # on GB10 because PyTorch's bundled ptxas is too old to know sm_121a, not
      # because Blackwell is unsupported; the Dockerfile points TRITON_PTXAS_PATH
      # at the CUDA 13.1 ptxas instead, and entrypoint.sh compiles a real Triton
      # kernel at startup and enables torch.compile only if it actually runs.
      #
      # Empty (the default) means "probe and decide". Set TORCH_COMPILE_DISABLE=1
      # in .env to skip the probe and pin the old always-off behaviour.
      TORCH_COMPILE_DISABLE: "${TORCH_COMPILE_DISABLE:-}"

      # Compile caches, all pointed into the mounted /opt/cache volume below.
      # Their defaults (/tmp/torchinductor_*, ~/.nv/ComputeCache) live inside the
      # container and are thrown away on every recreate, which would mean paying
      # the full TorchInductor compile cost again after each `up --force-recreate`.
      TORCHINDUCTOR_CACHE_DIR: "/opt/cache/inductor"
      TRITON_CACHE_DIR: "/opt/cache/triton"
      CUDA_CACHE_PATH: "/opt/cache/nv"
      # Only meaningful now that CUDA_CACHE_PATH points somewhere persistent.
      CUDA_CACHE_MAXSIZE: "4294967296"

      CUDA_MODULE_LOADING: "LAZY" # EAGER works as well, however LAZY loads models in memory a lot faster
      NCCL_P2P_DISABLE: "1"
      # NOT "HF_TOKENIZERS_PARALLELISM" — huggingface/tokenizers reads this exact
      # name, and the HF_-prefixed spelling that used to be here was read by
      # nothing at all.
      TOKENIZERS_PARALLELISM: "false"

      # DO NOT re-add the "unified memory optimization" env vars that used to
      # live here. PYTORCH_NO_CUDA_MEMORY_CACHING=1 disables PyTorch's caching
      # allocator, which turns every tensor alloc into a cudaMalloc and every
      # free into a device-wide-synchronizing cudaFree — thousands of times per
      # sampler step. That alone makes sampling look permanently stuck.
      # CUDA_DEVICE_MAX_CONNECTIONS=1 (single work queue, no stream overlap),
      # CUDA_MANAGED_FORCE_DEVICE_ALLOC=1 (fights the GB10 migration engine) and
      # CUBLAS_WORKSPACE_CONFIG (caps cuBLAS workspace) compound it.

    volumes:
      # --- PERSISTENT STORAGE (Read/Write) ---

      # 1. Models (Shared with host)
      - ${COMFYUI_HOST_PATH}/models:/opt/ComfyUI/models:rw

      # 2. Settings, User workflows, Manager config
      - ${COMFYUI_DATA_PATH}/user:/opt/ComfyUI/user:rw

      # 3. Custom Nodes
      - ${COMFYUI_DATA_PATH}/custom_nodes:/opt/ComfyUI/custom_nodes:rw

      # 4. Inputs/Outputs/Workflows
      - ${COMFYUI_DATA_PATH}/output:/opt/ComfyUI/output:rw
      - ${COMFYUI_DATA_PATH}/input:/opt/ComfyUI/input:rw
      - ${COMFYUI_DATA_PATH}/workflows:/opt/ComfyUI/workflows:rw

      # 5. Wheel Vault (Optional)
      - ${COMFYUI_DATA_PATH}/wheels:/opt/wheels:rw

      # 6. Compile caches (TorchInductor / Triton / CUDA JIT). Keeping these
      #    outside the container is what makes torch.compile pay off across
      #    restarts instead of recompiling from scratch every time.
      - ${COMFYUI_DATA_PATH}/cache:/opt/cache:rw

      # 7. Container HOME. Nodes that build their own environments write here —
      #    comfy-env/pixi puts the comfyui-sam3 environment in $HOME/.ce — and
      #    without this it is rebuilt on every recreate.
      - ${COMFYUI_DATA_PATH}/home:/home/comfy:rw

    networks:
      - comfy_net

    # Health check - ComfyUI takes time to load, so generous start period
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8188/" ]
      interval: 30s
      timeout: 10s
      start_period: 120s
      retries: 3

    restart: unless-stopped

  # ComfyUIMini - Mobile-friendly UI
  # Access at http://<host>:3000
  # comfyuimini:
  #   build:
  #     context: ./comfyuimini
  #     dockerfile: Dockerfile
